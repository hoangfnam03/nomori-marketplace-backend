name: Backend CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.100'

    - name: Restore dependencies
      run: dotnet restore
      env:
        # Suppress NuGet security audit errors (NU1902, NU1903)
        # Transitive dependency System.Security.Cryptography.Pkcs has known vulnerabilities
        # This is tracked and will be fixed when upstream packages are updated
        DOTNET_NUGET_AUDIT_MODE: warn

    - name: Build
      run: dotnet build --no-restore --configuration Release /p:RunAnalyzers=false /p:WarningLevel=0

    - name: Test
      run: dotnet test --no-build --verbosity normal --configuration Release
