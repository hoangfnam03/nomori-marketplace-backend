name: Build and Push Backend Images

on:
  push:
    branches:
      - main
    paths:
      - 'deploy/**'
      - 'src/**'
      - 'Nomori.Marketplace.Api/**'
      - 'Nomori.Marketplace.Core/**'
      - 'Nomori.Marketplace.Data/**'
      - 'Nomori.Marketplace.Services/**'
      - 'Nomori.Marketplace.Web.Framework/**'
      - '.github/workflows/build-and-push.yml'
  workflow_dispatch:
    inputs:
      version:
        description: 'Image version tag (e.g., v1, v2, 2026-10-27.1)'
        required: true
        default: 'v1'

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: ${{ github.repository_owner }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine version tag
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="$(date +%Y-%m-%d.%H%M%S)"
          fi
          echo "tag=${VERSION}" >> $GITHUB_OUTPUT
          echo "Building images with tag: ${VERSION}"

      - name: Build and push API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./deploy/api.Dockerfile
          target: api
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/nomori-api:${{ steps.version.outputs.tag }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/nomori-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Migrator image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./deploy/api.Dockerfile
          target: migrator
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/nomori-migrator:${{ steps.version.outputs.tag }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/nomori-migrator:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Proxy image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./deploy/azure-proxy.Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/nomori-proxy:${{ steps.version.outputs.tag }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/nomori-proxy:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Output image tags
        run: |
          echo "✅ Images pushed successfully!"
          echo ""
          echo "API: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/nomori-api:${{ steps.version.outputs.tag }}"
          echo "Migrator: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/nomori-migrator:${{ steps.version.outputs.tag }}"
          echo "Proxy: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/nomori-proxy:${{ steps.version.outputs.tag }}"
          echo ""
          echo "For Azure deployment, use this version tag in your Azure CLI commands:"
          echo "VER=\"${{ steps.version.outputs.tag }}\""
