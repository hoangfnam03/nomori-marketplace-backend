name: Deploy to Azure Container Apps

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Image version tag to deploy (e.g., v1, v2, latest)'
        required: true
        default: 'latest'
      run_migration:
        description: 'Run database migration before deployment?'
        required: false
        type: boolean
        default: true

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: ${{ github.repository_owner }}
  RG: nomori-demo-rg
  LOCATION: southeastasia
  ENV_NAME: nomori-demo-env

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: azure-production

    steps:
      - name: Check GHN secrets
        env:
          GHN_TOKEN: ${{ secrets.GHN_TOKEN }}
          GHN_SHOP_ID: ${{ secrets.GHN_SHOP_ID }}
          GHN_WEBHOOK_SECRET: ${{ secrets.GHN_WEBHOOK_SECRET }}
        run: |
          # Stop before anything changes: an empty secret would overwrite the API's GHN settings.
          missing=""
          [ -n "$GHN_TOKEN" ] || missing="$missing GHN_TOKEN"
          [ -n "$GHN_SHOP_ID" ] || missing="$missing GHN_SHOP_ID"
          [ -n "$GHN_WEBHOOK_SECRET" ] || missing="$missing GHN_WEBHOOK_SECRET"
          if [ -n "$missing" ]; then
            echo "::error::Missing GitHub secrets:$missing"
            exit 1
          fi

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Register Azure Resource Providers
        run: |
          echo "📦 Registering Azure resource providers..."
          az provider register -n Microsoft.App --wait
          az provider register -n Microsoft.OperationalInsights --wait
          echo "✅ Resource providers registered"

      - name: Run Database Migration
        if: github.event.inputs.run_migration == 'true'
        run: |
          echo "🔄 Running database migration..."
          az containerapp job update \
            --name nomori-migrate \
            --resource-group ${{ env.RG }} \
            --image "${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/nomori-migrator:${{ github.event.inputs.version }}"
          
          az containerapp job start \
            --name nomori-migrate \
            --resource-group ${{ env.RG }}
          
          echo "⏳ Waiting for migration to complete..."
          # Wait for migration (max 10 minutes)
          TIMEOUT=600
          ELAPSED=0
          while [ $ELAPSED -lt $TIMEOUT ]; do
            STATUS=$(az containerapp job execution list \
              --name nomori-migrate \
              --resource-group ${{ env.RG }} \
              --query "[0].status" -o tsv)
            
            if [ "$STATUS" = "Succeeded" ]; then
              echo "✅ Migration succeeded"
              exit 0
            elif [ "$STATUS" = "Failed" ]; then
              echo "❌ Migration failed"
              exit 1
            fi
            
            echo "Status: $STATUS... (${ELAPSED}s)"
            sleep 10
            ELAPSED=$((ELAPSED + 10))
          done
          
          echo "⚠️ Migration timeout after ${TIMEOUT}s"
          exit 1

      - name: Configure GHN on the API
        env:
          GHN_TOKEN: ${{ secrets.GHN_TOKEN }}
          GHN_SHOP_ID: ${{ secrets.GHN_SHOP_ID }}
          GHN_WEBHOOK_SECRET: ${{ secrets.GHN_WEBHOOK_SECRET }}
        run: |
          echo "🚚 Configuring GHN..."
          az containerapp secret set \
            --name nomori-api \
            --resource-group ${{ env.RG }} \
            --secrets ghn-token="$GHN_TOKEN" ghn-webhook-secret="$GHN_WEBHOOK_SECRET"
          # --set-env-vars keeps the API's other variables.
          az containerapp update \
            --name nomori-api \
            --resource-group ${{ env.RG }} \
            --set-env-vars \
              Shipping__Ghn__Enabled=true \
              Shipping__Ghn__ShopId="$GHN_SHOP_ID" \
              Shipping__Ghn__Token=secretref:ghn-token \
              Shipping__Ghn__WebhookSecret=secretref:ghn-webhook-secret

      - name: Update API Image
        run: |
          echo "🚀 Updating API image..."
          az containerapp update \
            --name nomori-api \
            --resource-group ${{ env.RG }} \
            --image "${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/nomori-api:${{ github.event.inputs.version }}"

      - name: Update Web Image
        run: |
          echo "🚀 Updating Web image..."
          az containerapp update \
            --name nomori-web \
            --resource-group ${{ env.RG }} \
            --image "${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/nomori-web:${{ github.event.inputs.version }}"

      - name: Update Proxy Image
        run: |
          echo "🚀 Updating Proxy image..."
          az containerapp update \
            --name nomori-proxy \
            --resource-group ${{ env.RG }} \
            --image "${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/nomori-proxy:${{ github.event.inputs.version }}"

      - name: Get Application URL
        run: |
          PROXY_FQDN=$(az containerapp show \
            --name nomori-proxy \
            --resource-group ${{ env.RG }} \
            --query properties.configuration.ingress.fqdn -o tsv)
          
          echo "✅ Deployment completed!"
          echo ""
          echo "🌐 Application URL: https://${PROXY_FQDN}"
          echo ""
          echo "Health check: https://${PROXY_FQDN}/health/ready"

      - name: Verify Deployment
        run: |
          PROXY_FQDN=$(az containerapp show \
            --name nomori-proxy \
            --resource-group ${{ env.RG }} \
            --query properties.configuration.ingress.fqdn -o tsv)
          
          echo "⏳ Waiting for API to be healthy..."
          TIMEOUT=120
          ELAPSED=0
          
          while [ $ELAPSED -lt $TIMEOUT ]; do
            # MapHealthChecks answers with plain text ("Healthy" / "Unhealthy"), not JSON, and HTTP 503 when unhealthy.
            HTTP_CODE=$(curl -s -o "$RUNNER_TEMP/health.txt" -w '%{http_code}' https://${PROXY_FQDN}/health/ready || echo "000")
            HEALTH=$(tr -d '\r\n' < "$RUNNER_TEMP/health.txt" 2>/dev/null || true)

            if [ "$HTTP_CODE" = "200" ] && [ "$HEALTH" = "Healthy" ]; then
              echo "✅ API is healthy"
              exit 0
            fi
            
            echo "Status: $HEALTH... (${ELAPSED}s)"
            sleep 5
            ELAPSED=$((ELAPSED + 5))
          done
          
          echo "⚠️ API health check timeout"
          exit 1

      - name: Send Deployment Notification
        if: success()
        run: |
          PROXY_FQDN=$(az containerapp show \
            --name nomori-proxy \
            --resource-group ${{ env.RG }} \
            --query properties.configuration.ingress.fqdn -o tsv)
          
          echo "📢 Deployment Successful!"
          echo "Version: ${{ github.event.inputs.version }}"
          echo "URL: https://${PROXY_FQDN}"
          echo "Time: $(date)"
